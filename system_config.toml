[compute]
threads = 0
queue_capacity = 1024
pin_threads_to_cores = false
cpu_affinity_offset = 0

[runtime]
shards = 0
pin_shards_to_cores = false
cpu_affinity_offset = 0

[workflow]
enabled = true

[[workflow.model_providers]]
name = "openai"
base_url = "https://api.openai.com"
responses_path = "/v1/responses"
api_key_env = "OPENAI_API_KEY"
timeout_sec = 120
max_response_bytes = 16777216

# MCP servers are optional. Tool identifiers use "server_name/tool_name".
# [[workflow.mcp_servers]]
# name = "internal"
# url = "https://mcp.example.com/mcp"
# bearer_token_env = "MCP_API_TOKEN"
# protocol_version = "2025-06-18"
# timeout_sec = 120
# max_response_bytes = 16777216

[api]
enabled = true
host = "127.0.0.1"
port = 8888
reuse_port = false
tls_enabled = false
tls_cert_file = ""
tls_key_file = ""
