[runtime]
shards = 0
pin_shards_to_cores = false
cpu_affinity_offset = 0

[compute]
threads = 0
queue_capacity = 1024
pin_threads_to_cores = false
cpu_affinity_offset = 0

[sandbox]
minijail_path = "/opt/dagforge/libexec/dagforge/minijail/minijail0"
seccomp_bpf_path = "/opt/dagforge/libexec/dagforge/minijail/dagforge_command.bpf"
workspace_root = "/var/lib/dagforge/workspaces"
max_memory_bytes = 1073741824
max_file_bytes = 67108864
tmp_bytes = 67108864
max_processes = 128
max_open_files = 256

[workflow]
enabled = true

[admission]
allow_unlisted_programs = true
allow_unlisted_environment = true
allowed_programs = []
allowed_environment = []
max_nodes = 256
max_parallel_nodes = 32
max_total_output_bytes = 67108864
max_run_duration_sec = 3600

[storage]
enabled = false
directory = "/var/lib/dagforge/state"

[api]
enabled = true
host = "0.0.0.0"
port = 8888
reuse_port = false
tls_enabled = false
tls_cert_file = ""
tls_key_file = ""
bearer_token_env = ""
max_request_body_bytes = 1048576
max_concurrent_requests = 128
