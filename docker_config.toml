[runtime]
shards = 0
pin_shards_to_cores = false
cpu_affinity_offset = 0

[compute]
threads = 0
queue_capacity = 1024
pin_threads_to_cores = false
cpu_affinity_offset = 0

[sandbox]
minijail_path = "/opt/dagforge/libexec/dagforge/minijail/minijail0"
seccomp_bpf_path = "/opt/dagforge/libexec/dagforge/minijail/dagforge_command.bpf"
workspace_root = "/var/lib/dagforge/workspaces"
max_memory_bytes = 1073741824
max_file_bytes = 67108864
tmp_bytes = 67108864
max_processes = 128
max_open_files = 256

[workflow]
enabled = true

[[workflow.model_providers]]
name = "openai"
base_url = "https://api.openai.com"
responses_path = "/v1/responses"
api_key_env = "OPENAI_API_KEY"
timeout_sec = 120
max_response_bytes = 16777216

[api]
enabled = true
host = "0.0.0.0"
port = 8888
reuse_port = false
tls_enabled = false
tls_cert_file = ""
tls_key_file = ""
