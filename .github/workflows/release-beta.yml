name: Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example 0.3.0 or 0.4.0-beta.1
        required: true
        default: 0.3.0

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify release bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release-bundle
          platforms: linux/amd64
          push: false
          outputs: type=local,dest=release-root
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package reproducible archive
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          archive_abs=$(bash scripts/package-release.sh \
            "$RELEASE_TAG" release-root dist)
          archive="dist/$(basename "$archive_abs")"
          bash scripts/verify-release.sh "$archive" --no-exec
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksums=dist/sha256sums-${RELEASE_TAG}.txt" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ inputs.tag }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksums }}
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ contains(inputs.tag, 'alpha') || contains(inputs.tag, 'beta') || contains(inputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksums }}
