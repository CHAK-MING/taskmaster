services:
  dagforge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: ${DAGFORGE_BUILD_JOBS:-0}
    container_name: dagforge-runtime
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8888:8888"
    volumes:
      - ./docker_config.toml:/opt/dagforge/system_config.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
