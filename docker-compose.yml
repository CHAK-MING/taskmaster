services:
  dagforge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: ${DAGFORGE_BUILD_JOBS:-0}
    container_name: dagforge-runtime
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    cap_drop:
      - ALL
    ports:
      - "8888:8888"
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./docker_config.toml:/opt/dagforge/system_config.toml:ro
      - dagforge_workspaces:/var/lib/dagforge/workspaces

volumes:
  dagforge_workspaces:
