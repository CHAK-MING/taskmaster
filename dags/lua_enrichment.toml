id = "lua_enrichment"
name = "Lua Enrichment"
description = "Shows how a Lua task can transform JSON, write XCom, and return structured output"

[[tasks]]
id = "fetch_payload"
name = "Fetch Payload"
command = "echo '{\"order_id\":\"ORD-2026-0007\",\"customer\":\"acme\",\"subtotal\":128.5,\"items\":[{\"sku\":\"cpu\",\"qty\":2},{\"sku\":\"ram\",\"qty\":4}]}'"

[[tasks.xcom_push]]
key = "payload"
source = "json"

[[tasks]]
id = "enrich_payload"
name = "Enrich Payload In Lua"
executor = "lua"
dependencies = ["fetch_payload"]
max_instructions = 4096
max_memory_mb = 8
script = """
  local payload = dagforge.xcom_pull("fetch_payload", "payload")
  local enriched = {
    order_id = payload.order_id,
    customer = payload.customer,
    item_count = #payload.items,
    subtotal = payload.subtotal,
    tax = payload.subtotal * 0.13,
    total = payload.subtotal * 1.13,
    reviewed_at = dagforge.execution_date,
  }

  dagforge.log("Lua enriched order " .. enriched.order_id)
  dagforge.xcom_push("enriched_order", enriched)
  return dagforge.json_encode(enriched)
"""

[[tasks]]
id = "report"
name = "Report Result"
command = "echo 'Lua task finished with enriched_order in XCom'"
dependencies = ["enrich_payload"]
