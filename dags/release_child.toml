id = "release_child"
name = "Release Child"
description = "Child DAG that reads release metadata from dagforge.conf"

[[tasks]]
id = "deploy_release"
name = "Deploy Release"
executor = "lua"
max_instructions = 4096
max_memory_mb = 8
script = """
  local request = dagforge.conf.release
  if not request then
    error("missing dagforge.conf.release; run this DAG via release_parent")
  end
  local release = {
    version = request.version,
    environment = request.environment,
    requested_by = request.requested_by,
    received_at = dagforge.execution_date,
  }

  dagforge.log("Deploying " .. release.version .. " to " .. release.environment)
  dagforge.xcom_push("release_summary", release)
  return dagforge.json_encode(release)
"""
